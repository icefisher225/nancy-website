<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#ffffff" />
    <meta
      name="theme-color"
      content="#0f1115"
      media="(prefers-color-scheme: dark)"
    />
    <title>Articles | Nancy Cheevers</title>
    <meta name="description" content="Articles and writing." />
    <link rel="stylesheet" href="/css/styles.css?v=5" />
    <script type="module" src="/js/main.js"></script>
  </head>
  <body>
    <header class="site-header">
      <div class="container header-inner">
        <a class="brand" href="/">Nancy Cheevers</a>
        <button
          class="nav-toggle"
          data-nav-toggle
          aria-label="Toggle menu"
          aria-controls="nav-menu"
          aria-expanded="false"
        >
          <span class="nav-toggle-bar"></span>
          <span class="nav-toggle-bar"></span>
          <span class="nav-toggle-bar"></span>
        </button>
        <nav class="nav" id="nav-menu" data-nav-menu aria-label="Primary">
          <a href="/">Home</a>
          <a href="/articles/">Articles</a>
          <a href="/contact/">Contact</a>
        </nav>
      </div>
    </header>

    <main>
      <section class="section container">
        <h1 class="page-title">Articles</h1>
        <p class="lead">Writing, notes, and updates. Add new posts as folders.</p>

        <!--
          Each card is text on the left and an optional thumbnail on the right.
          The .article-card-body wrapper is what lets the two sit side by side.

          Thumbnails are alt="" on purpose: they repeat the article's lead image
          and the heading link right beside them already says what the article
          is, so describing them again would just make screen readers read every
          entry twice. A card with no thumbnail simply lets the text run full
          width -- see "Good News for Amtrak!", which has no images.
        -->
        <ul class="article-list">
          <li class="article-card">
            <div class="article-card-body">
              <h2><a href="/articles/20240514_amtrak_hudson_line/">Amtrak: The Hudson Line</a></h2>
              <time datetime="2024-05-14">May 14, 2024</time>
              <p>
                An article on the Amtrak Hudson Line.
              </p>
            </div>
            <img class="article-thumb" src="/articles/20240514_amtrak_hudson_line/thumb-hudsonline.jpg"
                 alt="" width="640" height="400" loading="lazy" decoding="async">
          </li>
        </ul>
      </section>
    </main>

    <footer class="site-footer">
      <div class="container">
        <p>&copy; <span data-year>2026</span> Nancy Cheevers. All rights reserved.</p>
      </div>
    </footer>
  </body>
</html>
